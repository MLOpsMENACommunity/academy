# Local development stack.
#   pnpm infra:up         -> postgres, minio, mailpit only (run api/web on the host with `pnpm dev`)
#   docker compose up     -> everything, including api and web built from their Dockerfiles
name: academy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy
      POSTGRES_DB: academy
    ports: ['127.0.0.1:5433:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U academy']
      interval: 5s
      retries: 10

  # MinIO (S3-compatible) standing in for the private Cloudflare R2 bucket.
  # The official minio/minio image is no longer published on Docker Hub; pgsty/minio is a maintained rebuild.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [miniodata:/data]

  # Catches every outgoing email: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      secrets: [extra_ca]
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://academy:academy@postgres:5432/academy?schema=public
      WEB_URL: http://localhost:3000
      JWT_ACCESS_SECRET: local-compose-secret-not-for-production-0123456789
      COOKIE_SECURE: 'false'
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: academy-private
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: 'true'
      S3_CREATE_BUCKET: 'true'
      SEED_ADMIN_EMAIL: admin@academy.local
      SEED_ADMIN_PASSWORD: ChangeMe-Admin-2026
      ALLOW_INSECURE_PRODUCTION: 'true'
      RUN_MIGRATIONS: 'true'
      RUN_SEED: 'true'
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
      mailpit: { condition: service_started }
    ports: ['127.0.0.1:4000:4000']

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets: [extra_ca]
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]
    ports: ['127.0.0.1:3000:3000']

# Optional extra CA for builds behind a TLS-inspecting proxy (e.g. Cloudflare Gateway):
#   EXTRA_CA_FILE=/path/to/ca.pem docker compose build
secrets:
  extra_ca:
    file: ${EXTRA_CA_FILE:-./docker/empty-ca.pem}

volumes:
  pgdata:
  miniodata:
