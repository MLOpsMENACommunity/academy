name: Deploy to Cloudflare

# Reusable deploy of one git ref to one environment. Not run by hand: it is called by
#   release-staging.yml    (environment staging:    Worker mlops-academy-staging)
#   release-production.yml (environment production: Worker mlops-academy)
# Builds both container images on the runner (linux/amd64, as Cloudflare Containers
# require), deploys the Worker + containers, sets runtime secrets, then smoke-tests the
# environment's host. Secrets and variables come from the GitHub environment of the same
# name. See DEPLOY.md.
on:
  workflow_call:
    inputs:
      environment:
        description: staging or production
        required: true
        type: string
      ref:
        description: The tag to check out and deploy
        required: true
        type: string
      sha:
        description: The commit the tag must point to (guards against a moved tag)
        required: true
        type: string
    outputs:
      url:
        description: Public URL of the deployed environment
        value: ${{ jobs.deploy.outputs.url }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 from 19 Oct 2026
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.host.outputs.url }}
    concurrency:
      group: deploy-cloudflare-${{ inputs.environment }}
      cancel-in-progress: false
    outputs:
      url: ${{ steps.host.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ inputs.environment }}
      REF: ${{ inputs.ref }}
      SHA: ${{ inputs.sha }}
      # wrangler.jsonc: production is the top level (--env=""), staging is env.staging.
      WRANGLER_ENV: ${{ inputs.environment == 'staging' && 'staging' || '' }}
    steps:
      - name: Check target
        run: |
          case "$TARGET" in
            staging|production) ;;
            *) echo "::error::Unknown environment '$TARGET' (expected staging or production)"; exit 1 ;;
          esac
          [[ "$REF" == v* ]] || { echo "::error::Only v* tags are deployed (got '$REF')"; exit 1; }

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Check the tag still points at the verified commit
        run: |
          head=$(git rev-parse HEAD)
          [ "$head" = "$SHA" ] || { echo "::error::$REF now points at $head, expected $SHA. Was the tag moved?"; exit 1; }

      # Each GitHub environment must say which one it is (variable ACADEMY_ENVIRONMENT), so a
      # staging deploy can never run with production's database: staging only gets the marker
      # once setup-staging.sh has given it its own secrets.
      - name: Check the environment's values are its own
        env:
          MARKER: ${{ vars.ACADEMY_ENVIRONMENT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          if [ "$MARKER" != "$TARGET" ]; then
            echo "::error::The '$TARGET' environment has ACADEMY_ENVIRONMENT='$MARKER', expected '$TARGET'. Set it only once the environment's secrets are its own (staging: deploy/cloudflare/setup-staging.sh)."
            exit 1
          fi
          # Both URLs are required on staging: a Worker secret is never deleted by a deploy, so
          # an empty one would leave a stale value running. Nothing parsed from a URL is echoed
          # (a malformed one could hold the password).
          if [ "$TARGET" = staging ]; then
            for name in DATABASE_URL DIRECT_DATABASE_URL; do
              url=${!name}
              [ -n "$url" ] || { echo "::error::Staging needs $name"; exit 1; }
              rest=${url#*://}; role=${rest%%[:@]*}; path=${rest#*@}; path=${path%%\?*}
              [[ "$path" == */* ]] || { echo "::error::$name has no database name"; exit 1; }
              db=${path##*/}
              [[ "$db" =~ ^[A-Za-z0-9_-]+$ && "$db" == *staging* ]] || { echo "::error::$name must point at a staging database"; exit 1; }
              [[ "$role" == *staging* ]] || { echo "::error::$name must connect with the staging database role"; exit 1; }
            done
          fi

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @academy/deploy-cloudflare...

      - name: Check required secrets
        env:
          REQUIRED: >-
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL JWT_ACCESS_SECRET JOBS_TOKEN
            RESEND_API_KEY S3_ENDPOINT S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY SEED_ADMIN_EMAIL SEED_ADMIN_PASSWORD
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          missing=""
          for k in $REQUIRED; do
            echo "$SECRETS_JSON" | jq -e --arg k "$k" '.[$k] // "" | length > 0' >/dev/null || missing="$missing $k"
          done
          if [ -n "$missing" ]; then echo "::error::Missing secrets in the '$TARGET' environment:$missing (see DEPLOY.md)"; exit 1; fi

      # Hostnames come from the environment's variables (Settings → Environments → <env>):
      # ACADEMY_HOSTNAME, optional ACADEMY_REDIRECT_HOSTS and SENTRY_ENVIRONMENT. See DEPLOY.md.
      - name: Configure hostname
        id: host
        working-directory: deploy/cloudflare
        env:
          ACADEMY_HOSTNAME: ${{ vars.ACADEMY_HOSTNAME }}
          ACADEMY_REDIRECT_HOSTS: ${{ vars.ACADEMY_REDIRECT_HOSTS }}
          SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
          # Staging only (ignored for production): testers who get their own staging email.
          EMAIL_ALLOWLIST: ${{ vars.EMAIL_ALLOWLIST }}
          EMAIL_REDIRECT_TO: ${{ vars.EMAIL_REDIRECT_TO }}
        run: node configure-host.mjs "$TARGET"

      - name: Ensure private R2 bucket
        working-directory: deploy/cloudflare
        env:
          BUCKET: ${{ steps.host.outputs.bucket }}
        run: pnpm exec wrangler r2 bucket create "$BUCKET" 2>&1 | tee /tmp/r2.log || grep -qi "already exists" /tmp/r2.log

      - name: Deploy Worker and containers
        working-directory: deploy/cloudflare
        run: pnpm exec wrangler deploy --env="$WRANGLER_ENV"

      - name: Set runtime secrets
        working-directory: deploy/cloudflare
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          echo "$SECRETS_JSON" | jq '{
            DATABASE_URL, DIRECT_DATABASE_URL, JWT_ACCESS_SECRET, JOBS_TOKEN, RESEND_API_KEY,
            S3_ENDPOINT, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY,
            SEED_ADMIN_EMAIL, SEED_ADMIN_PASSWORD, SEED_PLACEHOLDER_STATUS,
            GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, SENTRY_DSN
          } | with_entries(select(.value != null and .value != ""))' > /tmp/secrets.json
          pnpm exec wrangler secret bulk /tmp/secrets.json --env="$WRANGLER_ENV"
          rm -f /tmp/secrets.json

      - name: Smoke test
        env:
          HOST: ${{ steps.host.outputs.host }}
          REDIRECT_HOSTS: ${{ vars.ACADEMY_REDIRECT_HOSTS }}
        run: |
          # First request cold-starts both containers (migrations run on API start).
          for i in $(seq 1 30); do
            curl -fsS "https://$HOST/api/health" && break
            [ "$i" = 30 ] && { echo "::error::https://$HOST/api/health never came up"; exit 1; }
            sleep 10
          done
          # The web container cold-starts separately: give it the same patience.
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "https://$HOST/en" && break
            [ "$i" = 30 ] && { echo "::error::https://$HOST/en never came up"; exit 1; }
            sleep 10
          done
          # Plain http never reaches the containers (private calendar feed URLs carry a token).
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://$HOST/api/health" || true)
          [ "$code" = "301" ] || { echo "::error::http://$HOST returned $code, expected a 301 to https"; exit 1; }
          for alias in $(echo "$REDIRECT_HOSTS" | tr ',' ' '); do
            [ "$alias" = "$HOST" ] && continue
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$alias/en" || true)
            [ "$code" = "301" ] || { echo "::error::$alias returned $code, expected a 301 to $HOST"; exit 1; }
          done
          echo "Deployed $REF ($SHA) to $TARGET: https://$HOST" | tee -a "$GITHUB_STEP_SUMMARY"
