name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy
          POSTGRES_DB: academy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U academy" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://academy:academy@localhost:5432/academy?schema=public
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrate database
        run: pnpm --filter @academy/api exec prisma migrate deploy
      - name: Unit tests
        run: pnpm test
      # MinIO plays the private R2 bucket (signed URLs, uploads) for the e2e tests.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 30); do curl -fsS http://localhost:9000/minio/health/live && break; sleep 1; done
      - name: API e2e tests
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: academy-private
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_FORCE_PATH_STYLE: 'true'
          S3_CREATE_BUCKET: 'true'
        run: pnpm --filter @academy/api test:e2e --passWithNoTests
      - name: Build
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      actions: write # gha build cache
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Smoke test the compose stack
        run: |
          docker compose up -d --build --wait
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS -o /dev/null http://127.0.0.1:3000/en
          curl -fsS -o /dev/null http://127.0.0.1:3000/ar/privacy
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
