name: CI

# GitHub Actions minutes are limited (free plan, 2,000/month), so CI runs:
#  - on pull requests that are ready for review (draft PRs run nothing: test locally,
#    then mark the PR ready), skipping changes that only touch docs;
#  - from release-staging.yml on the release tag (workflow_call below).
# It no longer runs again on every merge to main: the release tag is the gate.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  # release-staging.yml runs CI on a tag whose commit has no passing CI run yet.
  workflow_call:
    inputs:
      ref:
        description: Commit to test (defaults to the triggering commit)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called, so a release never cancels main's CI.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Draft pull requests don't spend minutes; marking the PR ready runs CI.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 from 19 Oct 2026
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: academy
          POSTGRES_PASSWORD: academy
          POSTGRES_DB: academy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U academy" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://academy:academy@localhost:5432/academy?schema=public
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Migrate database
        run: pnpm --filter @academy/api exec prisma migrate deploy
      - name: Unit tests
        run: pnpm test
      # MinIO plays the private R2 bucket (signed URLs, uploads) for the e2e tests.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for i in $(seq 1 30); do curl -fsS http://localhost:9000/minio/health/live && break; sleep 1; done
      - name: API e2e tests
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: academy-private
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_FORCE_PATH_STYLE: 'true'
          S3_CREATE_BUCKET: 'true'
        run: pnpm --filter @academy/api test:e2e --passWithNoTests
      - name: Build
        run: pnpm build

  docker:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 from 19 Oct 2026
    needs: check
    permissions:
      contents: read
      actions: write # gha build cache
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Smoke test the compose stack
        run: |
          docker compose up -d --build --wait
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS -o /dev/null http://127.0.0.1:3000/en
          curl -fsS -o /dev/null http://127.0.0.1:3000/ar/privacy
      # Browser tests against the production images: main flow, accessibility (axe) and headers.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser e2e (Playwright)
        env:
          # Must match the API's WEB_URL: writes are checked against that origin.
          E2E_BASE_URL: http://localhost:3000
        run: pnpm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
